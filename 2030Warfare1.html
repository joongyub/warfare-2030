<meta name="apple-mobile-web-app-title" content="2030 Warfare">
<title>2030 Warfare 1</title>
<style>
  :root { --teal: #3fd6d2; --teal2: #1d8f9a; --panel: rgba(16, 26, 36, 0.86); --line: rgba(130, 220, 230, 0.35); --gold: #f6c453; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1218; touch-action: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", "NanumGothic", sans-serif; user-select: none; }
  #view { position: fixed; inset: 0; overflow: hidden; background: linear-gradient(#6fa9d6 0%, #a9d0ec 40%, #d8e8f2 100%); } #view canvas { touch-action: none; display: block; }
  #hud { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; color: #eef6f8; }
  #hud button, #hud .card, #hud .op, .title-screen, .result, .shop, #hud .sb, #hud input { pointer-events: auto; }
  /* 로비 프로필 카드 */
  .profile-card { position: absolute; right: 90px; top: 70px; width: 470px; padding: 22px 26px; background: rgba(12,22,32,.86); border: 1px solid rgba(143,243,255,.25); border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .pc-title { font-size: 18px; color: #8ff3ff; letter-spacing: 3px; font-weight: 700; margin-bottom: 12px; }
  .pc-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .pc-name { flex: 1; height: 52px; border-radius: 12px; border: 2px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; font-size: 24px; padding: 0 14px; font-family: inherit; }
  .pc-save { width: 96px; border: 0; border-radius: 12px; background: #3f8fe0; color: #fff; font-size: 20px; font-weight: 700; }
  .pc-stat { display: flex; justify-content: space-between; font-size: 20px; color: #b9c9d4; padding: 6px 2px; border-top: 1px solid rgba(255,255,255,.08); }
  .pc-stat b { color: var(--gold); }
  .pc-shop { margin-top: 14px; width: 100%; height: 60px; border: 0; border-radius: 14px; font-size: 24px; font-weight: 800; color: #3a2600; background: linear-gradient(#ffd96a, #f2a33a); }
  /* 게임 화면 프로필 바 */
  .pbar { position: absolute; left: 290px; top: 20px; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 4px; background: rgba(12,22,32,.72); border-radius: 18px; font-size: 15px; }
  .pb-ava { width: 26px; height: 26px; border-radius: 50%; background: #3f8fe0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
  .pb-cred { color: var(--gold); font-weight: 700; }
  .pb-shop { height: 26px; border: 0; border-radius: 13px; padding: 0 10px; background: #f2a33a; color: #3a2600; font-weight: 800; font-size: 13px; }
  /* 전략 무기 */
  .strat { position: absolute; right: 14px; bottom: 14px; width: 304px; display: flex; gap: 8px; }
  .sb { position: relative; flex: 1; height: 62px; border-radius: 14px; background: rgba(60,20,22,.82); border: 2px solid rgba(255,90,80,.3); padding: 6px 8px 0 30px; box-sizing: border-box; cursor: pointer; opacity: .6; }
  .sb i { position: absolute; left: 9px; top: 6px; font-style: normal; font-weight: 800; color: #ff8a8e; }
  .sb b { display: block; font-size: 15px; white-space: nowrap; } .sb span { font-size: 12px; color: #e6b3b3; }
  .sb.ready { opacity: 1; border-color: #ff5a4a; box-shadow: 0 0 16px rgba(255,80,60,.5); animation: sbpulse 1.4s infinite; }
  .sb.sel { border-color: #fff; }
  @keyframes sbpulse { 50% { box-shadow: 0 0 26px rgba(255,80,60,.85); } }
  /* 상점 */
  .shop { position: absolute; inset: 0; background: rgba(4,8,12,.6); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .sh-box { width: 1240px; padding: 28px 32px; background: #101c27; border-radius: 24px; border: 1px solid rgba(255,210,122,.3); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .sh-head { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; } .sh-head > b { font-size: 34px; }
  .sh-head span { font-size: 22px; color: #b9c9d4; } .sh-head span b { color: var(--gold); font-size: 26px; margin-left: 6px; }
  .sh-x { margin-left: auto; width: 48px; height: 48px; border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff; font-size: 22px; }
  .sh-packs { display: flex; gap: 16px; }
  .pk { position: relative; flex: 1; padding: 20px 12px 16px; border-radius: 18px; background: linear-gradient(#1d3245, #142231); border: 2px solid rgba(255,255,255,.1); text-align: center; }
  .pk em { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #e5484d; font-style: normal; font-weight: 800; font-size: 14px; padding: 3px 12px; border-radius: 10px; white-space: nowrap; }
  .pk-ico { font-size: 52px; } .pk b { display: block; font-size: 24px; color: var(--gold); margin-top: 6px; } .pk small { display: block; color: #8fc3f0; font-size: 15px; height: 20px; }
  .pk button { margin-top: 12px; width: 100%; height: 50px; border: 0; border-radius: 12px; font-size: 22px; font-weight: 800; color: #062a2e; background: linear-gradient(#6af0ea, #2cb9bd); }
  .sh-wd { display: flex; align-items: center; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.1); font-size: 20px; color: #d4e0e8; }
  .sh-wd button { height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #f2a33a; color: #3a2600; font-weight: 800; font-size: 18px; }
  .sh-note { margin-top: 16px; font-size: 15px; color: #c9a86a; }
  .toast.lobby { top: 40px; z-index: 60; }
  /* 핵 섬광 */
