  }
  // 휴대폰 브라우저(앱으로 연 게 아닐 때)에는 📲 설치 버튼을 늘 보여 줌 → 아이폰 '홈 화면에 추가' / 안드로이드 APK 안내
  if (((navigator.maxTouchPoints || 0) > 0) && !/W2030App/.test(navigator.userAgent) && !navigator.standalone && !matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches) document.body.classList.add('show-install');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; document.body.classList.add('can-install'); });
</script>
